name: Build Project Kingdom

on:
  push:
    branches: [main, feature/vanilla-female-skirt-bust-20261026]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew test build --no-daemon
          python3 03_verify_project.py
          python3 -m unittest discover -s validation/runtime_smoke -p "test_*.py"


      - name: Compile read-only native API diagnostic
        run: javac -d build/pr72-review validation/pr72_review/TfcRecipeApiAgent.java
