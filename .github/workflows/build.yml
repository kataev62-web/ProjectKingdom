name: Build Project Kingdom

on:
  push:
    branches: [main, feature/vanilla-female-skirt-bust-20261026, feature/ai-architect-ai1]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew test cityArchitectTest build cityArchitectJar --no-daemon
          python3 03_verify_project.py

      - name: Upload base and city architect JARs
        uses: actions/upload-artifact@v4
        with:
          name: project-kingdom-with-city-architect
          path: |
            build/libs/kingdomnpc-*.jar
            build/libs/kingdom-city-architect-*.jar
          if-no-files-found: error
