# Project Kingdom - dedicated server
# Forge 1.20.1 / 47.3.0. Generated for the dedicated server, not for the client.
#
# The mod is authoritative: the server decides every settlement, every payment
# and every ownership change. Clients only send requests.

# --- network -----------------------------------------------------------------
server-port=25565
server-ip=
motd=Project Kingdom
enable-status=true
network-compression-threshold=256
max-players=20
rate-limit=0

# --- authentication -----------------------------------------------------------
# Secure default: the vanilla authentication is ON.
#
# The launcher token gate (AuthGate / TokenVerifier) exists in the mod, but it
# is NOT connected to the login flow yet: the platform adapter is missing and
# the verifier accepts nothing. Until that adapter is installed and the gate is
# wired into the join flow, the server must not rely on it and must not run
# with the vanilla authentication switched off.
#
# Switch online-mode to false ONLY together with a working token gate and a
# proven authentication test. See docs/ISSUE_55_SERVER_INFRASTRUCTURE_RU.md.
online-mode=true
# The white list is the second lock: only the listed accounts may enter.
enforce-whitelist=true
white-list=true
# Never let a client speak as a server operator.
op-permission-level=4
function-permission-level=2
# A fresh player gets no operator rights by default.
spawn-protection=16
force-gamemode=false
allow-nether=true
allow-flight=false

# --- world --------------------------------------------------------------------
level-name=world
level-seed=
gamemode=survival
difficulty=normal
pvp=false
view-distance=10
simulation-distance=10
# Durability: every chunk write is flushed to disk. This is what makes a
# settled delivery survive a power loss together with the settlement journal.
sync-chunk-writes=true
entity-broadcast-range-percentage=100
# The game world needs its population: the ranch counts and feeds real
# animals, and the professions work with real villagers. The mod creates its
# own workers explicitly and does not adopt stray villagers, so the natural
# spawns do not compete with the hired workforce.
spawn-monsters=false
spawn-npcs=true
spawn-animals=true
allow-mob-destruction=true
mob-griefing=false
do-daylight-cycle=true
do-weather-cycle=true
keep-spawn-loaded=true

# --- maintenance --------------------------------------------------------------
enable-command-block=false
enable-query=false
enable-rcon=false
rcon.port=25575
rcon.password=
player-idle-timeout=0
hide-online-players=false
use-native-transport=true
