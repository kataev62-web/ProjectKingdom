plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
version = '0.1.0-stage0-dev'
group = 'ru.projectkingdom'
base { archivesName = 'kingdomnpc' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client { workingDirectory project.file('run'); mods { kingdomnpc { source sourceSets.main } } }
        server { workingDirectory project.file('run'); args '--nogui'; mods { kingdomnpc { source sourceSets.main } } }
    }
}
repositories { mavenCentral() }
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test') { useJUnitPlatform() }
jar { manifest { attributes(['Specification-Title':'Kingdom NPC', 'Implementation-Version':project.version]) } }
